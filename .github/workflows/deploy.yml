name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck & unit tests
        run: npm run typecheck && npm test
      - name: Build web app
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Worker secrets are only set when the corresponding GitHub secret exists,
      # so a missing secret never overwrites an existing Cloudflare value with empty.
      - name: Set NCBI_API_KEY worker secret
        if: ${{ secrets.NCBI_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.NCBI_API_KEY }}" | npx wrangler secret put NCBI_API_KEY
      - name: Set NCBI_EMAIL worker secret
        if: ${{ secrets.NCBI_EMAIL != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.NCBI_EMAIL }}" | npx wrangler secret put NCBI_EMAIL
      - name: Set PROXY_SIGNING_SECRET worker secret
        if: ${{ secrets.PROXY_SIGNING_SECRET != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.PROXY_SIGNING_SECRET }}" | npx wrangler secret put PROXY_SIGNING_SECRET
